name: import-lh-unfiltered
on:
  push:
    branches: [lh-unfiltered-import]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download lh-unfiltered-transport --pattern "life_history_unfiltered.csv" --dir /tmp/dl
      - name: Place and commit
        run: |
          cp /tmp/dl/life_history_unfiltered.csv __merging_life_history/life_history_unfiltered.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add __merging_life_history/life_history_unfiltered.csv
          git commit -m "Update life_history_unfiltered.csv (release-asset import)"
          git push
