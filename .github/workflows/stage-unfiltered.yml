name: Stage unfiltered CSV
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/stage-unfiltered.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wiring-bodyecology-faurby
      - name: Download staged CSV
        run: |
          curl -L --fail -o __merging_body_ecology/body_ecology_unfiltered.csv https://github.com/AleAliSousa/Evo-M1-Trait-Data/releases/download/temp-bodyecology-unfiltered/body_ecology_unfiltered.csv
          test "$(stat -c%s __merging_body_ecology/body_ecology_unfiltered.csv)" = "30150575"
      - name: Commit staged CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add __merging_body_ecology/body_ecology_unfiltered.csv
          git commit -m "Wire Faurby 2018 PHYLACINE body masses into the body-ecology merge"
          git push
